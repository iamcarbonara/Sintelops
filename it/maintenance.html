  <style>
    /* =============================================
       MAINTENANCE PAGE — OVERRIDES & ADDITIONS
       Builds on top of the Sintelops Design System
       ============================================= */

    body {
      background-color: var(--stripe-navy);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* ---- Animated Background ---- */
    .bg-gradient {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: 
        radial-gradient(ellipse 80% 60% at 20% 80%, rgba(83,58,253,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 20%, rgba(234,34,97,0.1) 0%, transparent 50%),
        radial-gradient(ellipse 90% 70% at 50% 50%, rgba(28,30,84,1) 0%, rgba(6,27,49,1) 100%);
      animation: bgShift 12s ease-in-out infinite alternate;
    }

    @keyframes bgShift {
      0%   { opacity: 1; }
      50%  { opacity: 0.85; }
      100% { opacity: 1; }
    }

    /* ---- Floating Orbs ---- */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      animation: float 8s ease-in-out infinite;
      will-change: transform;
    }

    .orb-1 {
      width: 400px;
      height: 400px;
      background: rgba(83,58,253,0.2);
      top: -100px;
      right: -100px;
      animation-duration: 10s;
    }

    .orb-2 {
      width: 300px;
      height: 300px;
      background: rgba(234,34,97,0.12);
      bottom: -80px;
      left: -80px;
      animation-duration: 14s;
      animation-delay: -4s;
    }

    .orb-3 {
      width: 200px;
      height: 200px;
      background: rgba(249,107,238,0.08);
      top: 40%;
      left: 60%;
      animation-duration: 18s;
      animation-delay: -8s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25%      { transform: translate(20px, -30px) scale(1.05); }
      50%      { transform: translate(-15px, 15px) scale(0.95); }
      75%      { transform: translate(10px, 25px) scale(1.02); }
    }

    /* ---- Grid Pattern Overlay ---- */
    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background-image: 
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 64px 64px;
      pointer-events: none;
    }

    /* ---- Main Content ---- */
    .maintenance-container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 40px;
      max-width: 640px;
      animation: fadeInUp 1s ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* Brand */
    .maintenance-brand {
      font-size: 22px;
      font-weight: 500;
      color: #ffffff;
      letter-spacing: 0.5px;
      margin-bottom: 64px;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 0.3s forwards;
    }

    /* Status Badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(83,58,253,0.12);
      border: 1px solid rgba(83,58,253,0.25);
      border-radius: 100px;
      padding: 8px 20px;
      font-size: 13px;
      font-weight: 400;
      color: var(--stripe-purple-light);
      margin-bottom: 40px;
      letter-spacing: 0.04em;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 0.5s forwards;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--stripe-purple);
      animation: pulse 2s ease-in-out infinite;
      position: relative;
    }

    .status-dot::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: rgba(83,58,253,0.3);
      animation: pulseRing 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.5; }
    }

    @keyframes pulseRing {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50%      { transform: scale(1.8); opacity: 0; }
    }

    /* Headline */
    .maintenance-title {
      font-size: 56px;
      font-weight: 300;
      line-height: 1.08;
      letter-spacing: -1.5px;
      color: #ffffff;
      margin-bottom: 24px;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 0.7s forwards;
      font-feature-settings: "ss01";
    }

    .maintenance-title em {
      font-style: normal;
      background: linear-gradient(135deg, var(--stripe-purple-light), var(--stripe-magenta));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Glowing Divider */
    .divider-glow {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--stripe-purple), transparent);
      margin: 32px auto;
      border: none;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 0.9s forwards;
    }

    /* Description */
    .maintenance-desc {
      font-size: 17px;
      font-weight: 300;
      line-height: 1.6;
      color: rgba(255,255,255,0.55);
      max-width: 480px;
      margin: 0 auto 48px;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 1.1s forwards;
    }

    /* Progress Bar */
    .progress-wrapper {
      max-width: 320px;
      margin: 0 auto 48px;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 1.3s forwards;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 100px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--stripe-purple), var(--stripe-magenta));
      border-radius: 100px;
      animation: progressAnim 3s ease-out 1.8s forwards;
    }

    @keyframes progressAnim {
      to { width: 72%; }
    }

    /* Contact Link */
    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 400;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      padding: 10px 24px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px;
      transition: all 0.3s ease;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 1.5s forwards;
    }

    .contact-link:hover {
      color: #ffffff;
      border-color: rgba(83,58,253,0.5);
      background: rgba(83,58,253,0.08);
    }

    .contact-link svg {
      width: 16px;
      height: 16px;
      opacity: 0.6;
      transition: opacity 0.3s ease;
    }

    .contact-link:hover svg {
      opacity: 1;
    }

    /* Footer */
    .maintenance-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.03em;
    }

    /* ---- Responsive ---- */
    @media (max-width: 768px) {
      .maintenance-title {
        font-size: 36px;
        letter-spacing: -0.8px;
      }
      .maintenance-desc {
        font-size: 15px;
      }
      .maintenance-container {
        padding: 24px;
      }
      .maintenance-brand {
        margin-bottom: 48px;
      }
      .orb-1 { width: 250px; height: 250px; }
      .orb-2 { width: 180px; height: 180px; }
      .orb-3 { width: 120px; height: 120px; }
    }

    @media (max-width: 480px) {
      .maintenance-title {
        font-size: 28px;
      }
      .status-badge {
        font-size: 11px;
        padding: 6px 16px;
      }
    }
  </style>
